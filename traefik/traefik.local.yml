## Traefik Global Configuration for Local Development
global:
  checkNewVersion: true
  sendAnonymousUsage: false

## API and dashboard configuration
api:
  dashboard: true
  insecure: true

## Configure providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
    network: web

## Configure entrypoints - only HTTP for local development
entryPoints:
  web:
    address: ":80"
