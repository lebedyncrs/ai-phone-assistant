## Traefik Global Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

## API and dashboard configuration
api:
  dashboard: true
  insecure: true  # Only for development. In production, set to false and configure secure access

## Configure providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
    network: web

## Configure entrypoints
entryPoints:
  web:
    address: ":80"
  
  websecure:
    address: ":443"

## Configure SSL certificates with Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      email: "sl@deliverycouple.com"  # Replace with your email
      storage: "/acme.json"
      httpChallenge:
        entryPoint: web
