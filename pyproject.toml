[project]
name = "voice-assistant"
version = "0.1.0"
description = "Voice AI assistant built with Pipecat"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[daily,deepgram,elevenlabs,openai,runner,silero,tracing,webrtc]",
    "python-telegram-bot>=22.7",
    "twilio>=9.10.4",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "redis>=5.0",
    "arize-otel>=0.13.0",
    "openinference-instrumentation-pipecat<=0.1.4",
    "openinference-instrumentation-openai>=0.1.52",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.pyrefly]
search-path = ["."]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
