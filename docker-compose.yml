version: '3'

services:
  # FastAPI Application
  api:
    build: .
    container_name: fastapi-app
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./storage:/app/storage
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.api.rule=Host(`api.deliverycouple.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      # HTTP router (for redirect)
      - "traefik.http.routers.api-http.rule=Host(`api.deliverycouple.com`)"
      - "traefik.http.routers.api-http.entrypoints=web"
      - "traefik.http.routers.api-http.middlewares=redirect-to-https"
      # Service configuration
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # Traefik Dashboard (optional)
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - web
    depends_on:
      - api

networks:
  web:
    external: true
